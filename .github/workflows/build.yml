name: Build TorrServer DSM

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    name: Check package version
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check PKG_VERSION change
        id: check
        run: |
          NEW_VERSION=$(grep -E '^PKG_VERSION[[:space:]]*:=' Makefile | head -1 | sed 's/^PKG_VERSION[[:space:]]*:=//' | xargs)
          echo "Current version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual workflow run"
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OLD_VERSION=$(git show "${{ github.event.before }}:Makefile" 2>/dev/null | grep -E '^PKG_VERSION[[:space:]]*:=' | head -1 | sed 's/^PKG_VERSION[[:space:]]*:=//' | xargs)
          echo "Previous version: $OLD_VERSION"

          if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
            echo "Package version changed!"
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Package version did not change."
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build SPK packages
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false # Отключаем кэш, так как go.mod находится в подпапке, чтобы избежать предупреждений

      - name: Clone and patch original TorrServer
        run: |
          TS_VERSION=$(grep -E '^TORRSERVER_VERSION[[:space:]]*:=' Makefile | sed 's/^TORRSERVER_VERSION[[:space:]]*:=//' | xargs)
          echo "Cloning original TorrServer version: $TS_VERSION"
          git clone https://github.com/YouROK/TorrServer.git torrserver_src
          cd torrserver_src
          git checkout "$TS_VERSION"
          
          # Патчим referer.go: заменяем весь массив defaultBlockedReferers на пустой
          sed -i '/var defaultBlockedReferers = \[\]string{/,/^}/c\var defaultBlockedReferers = []string{}' server/web/waf/referer.go
          
          echo "Проверка патча:"
          grep -A 1 "var defaultBlockedReferers" server/web/waf/referer.go

      - name: Build TorrServer binaries
        run: |
          # Создаем папку dest_bin в корне репозитория и сохраняем абсолютный путь
          mkdir -p dest_bin
          DEST_DIR=$(pwd)/dest_bin
          
          cd torrserver_src/server
          
          LDFLAGS="-s -w -checklinkname=0"
          BUILD_FLAGS="-ldflags='$LDFLAGS' -tags=nosqlite -trimpath"
          
          echo "Building linux/amd64..."
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build $BUILD_FLAGS -o "$DEST_DIR/TorrServer-linux-amd64" ./cmd
          
          echo "Building linux/arm64..."
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build $BUILD_FLAGS -o "$DEST_DIR/TorrServer-linux-arm64" ./cmd
          
          echo "Building linux/arm7..."
          GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build $BUILD_FLAGS -o "$DEST_DIR/TorrServer-linux-arm7" ./cmd
          
          echo "Built binaries:"
          ls -lh "$DEST_DIR"

      - name: Install DSM build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip xz-utils

      - name: Build SPK packages
        run: |
          make

      - name: List build results
        run: |
          echo "Built SPK packages:"
          find spk -maxdepth 1 -type f -name '*.spk' -print

      - name: Upload SPK packages as artifact
        uses: actions/upload-artifact@v4
        with:
          name: TorrServer-DSM-${{ needs.check-version.outputs.version }}
          path: spk/*.spk
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs:
      - check-version
      - build
    if: |
      github.event_name == 'push' &&
      needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built SPK packages
        uses: actions/download-artifact@v4
        with:
          name: TorrServer-DSM-${{ needs.check-version.outputs.version }}
          path: spk

      - name: Show release files
        run: |
          echo "Release version: ${{ needs.check-version.outputs.version }}"
          echo "Files:"
          ls -lh spk/*.spk

      - name: Update packages.json
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          cat <<EOF > packages.json
          {
            "packages": [
              {
                "package": "TorrServer",
                "version": "${VERSION}",
                "displayname": "TorrServer DSM",
                "description": "TorrServer, torrent to http (Uncensored build from original source)",
                "arch": "x86_64 aarch64 armv7",
                "maintainer": "vladlenas-fork",
                "distributor": "vladlenas-fork",
                "distributor_url": "https://github.com/${{ github.repository }}",
                "category": "download",
                "beta": false,
                "startable": true,
                "installable": true,
                "uninstallable": true
              }
            ]
          }
          EOF
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages.json
          git commit -m "Update packages.json to ${VERSION} [skip ci]" || echo "No changes to commit"
          git push

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            spk/*.spk \
            --title "TorrServer DSM v${VERSION} (Uncensored)" \
            --generate-notes
