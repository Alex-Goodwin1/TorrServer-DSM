name: Build TorrServer DSM & Android Client

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write


concurrency:
  group: torrserver-build
  cancel-in-progress: false

jobs:
  check-version:
    name: Check package version
    runs-on: ubuntu-24.04
    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check PKG_VERSION change
        id: check
        run: |
          NEW_VERSION=$(grep -E '^PKG_VERSION[[:space:]]*:=' Makefile | head -1 | sed 's/^PKG_VERSION[[:space:]]*:=//' | xargs)
          echo "Current version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual workflow run"
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OLD_VERSION=$(git show "${{ github.event.before }}:Makefile" 2>/dev/null | grep -E '^PKG_VERSION[[:space:]]*:=' | head -1 | sed 's/^PKG_VERSION[[:space:]]*:=//' | xargs)
          echo "Previous version: $OLD_VERSION"

          if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
            echo "Package version changed!"
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Package version did not change."
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build SPK and Android APK
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache: false

      - name: Setup Java for Android
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Clone and patch original TorrServer
        run: |
          TS_VERSION=$(grep -E '^TORRSERVER_VERSION[[:space:]]*:=' Makefile | sed 's/^TORRSERVER_VERSION[[:space:]]*:=//' | xargs)
          git clone https://github.com/YouROK/TorrServer.git torrserver_src
          cd torrserver_src
          git checkout "$TS_VERSION"
          
          sed -i '/var defaultBlockedReferers = \[\]string{/,/^}/c\var defaultBlockedReferers = []string{}' server/web/waf/referer.go
          
          grep -A 1 "var defaultBlockedReferers" server/web/waf/referer.go

          if ! grep -q 'var defaultBlockedReferers = \[\]string{}' server/web/waf/referer.go; then
            echo "::error::referer.go was not patched - defaultBlockedReferers format changed upstream"
            exit 1
          fi

      - name: Build TorrServer binaries
        env:
          GOTOOLCHAIN: auto
        run: |
          TS_VERSION=$(grep -E '^TORRSERVER_VERSION[[:space:]]*:=' Makefile | sed 's/^TORRSERVER_VERSION[[:space:]]*:=//' | xargs)
          echo "TorrServer source version: ${TS_VERSION}"

          mkdir -p dest_bin
          DEST_DIR=$(pwd)/dest_bin
          
          cd torrserver_src/server
          LDFLAGS="-s -w -checklinkname=0 -X server/version.Version=${TS_VERSION}"

          build_target() {
            local goos="$1" goarch="$2" goarm="$3" output="$4"

            if [ -n "${goarm}" ]; then
              GOOS="$goos" GOARCH="$goarch" GOARM="$goarm" CGO_ENABLED=0 \
                go build -ldflags="$LDFLAGS" -tags=nosqlite -trimpath -o "$output" ./cmd && return 0
            else
              GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
                go build -ldflags="$LDFLAGS" -tags=nosqlite -trimpath -o "$output" ./cmd && return 0
            fi

            echo "::warning::Retrying ${goos}/${goarch} without -checklinkname"

            if [ -n "${goarm}" ]; then
              GOOS="$goos" GOARCH="$goarch" GOARM="$goarm" CGO_ENABLED=0 \
                go build -ldflags="-s -w" -tags=nosqlite -trimpath -o "$output" ./cmd
            else
              GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
                go build -ldflags="-s -w" -tags=nosqlite -trimpath -o "$output" ./cmd
            fi
          }
          
          echo "Building linux/amd64..."
          build_target linux amd64 "" "$DEST_DIR/TorrServer-linux-amd64"

          NDK_ROOT="${ANDROID_NDK_LATEST_HOME:-}"
          if [ ! -d "${NDK_ROOT}" ]; then
            NDK_ROOT=$(ls -d "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"/ndk/* 2>/dev/null | sort -V | tail -1 || true)
          fi

          if [ -z "${NDK_ROOT}" ] || [ ! -d "${NDK_ROOT}" ]; then
            echo "::error::Android NDK not found - TorrServer-android-* cannot be built"
            exit 1
          fi

          NDK_TOOLCHAIN="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64"
          echo "Using Android NDK: ${NDK_ROOT}"

          build_android() {
            local cc="$1" goarch="$2" goarm="$3" output="$4"
            local arm_env=""

            if [ -n "${goarm}" ]; then
              arm_env="GOARM=${goarm}"
            fi

            echo "Building android/${goarch}..."
            env CC="${NDK_TOOLCHAIN}/bin/${cc}" CGO_ENABLED=1 GOOS=android GOARCH="${goarch}" ${arm_env} \
              go build -ldflags="${LDFLAGS}" -tags=nosqlite -trimpath -o "${output}" ./cmd
          }

          build_android aarch64-linux-android21-clang arm64 "" "$DEST_DIR/TorrServer-android-arm64"
          build_android armv7a-linux-androideabi21-clang arm 7 "$DEST_DIR/TorrServer-android-arm7"
          build_android x86_64-linux-android21-clang amd64 "" "$DEST_DIR/TorrServer-android-amd64"
          build_android i686-linux-android21-clang 386 "" "$DEST_DIR/TorrServer-android-386"
          
          echo "Built binaries:"
          ls -lh "$DEST_DIR"

          OUTPUT=$("$DEST_DIR/TorrServer-linux-amd64" --version 2>&1) && STATUS=0 || STATUS=$?
          echo "TorrServer --version exited with ${STATUS}: ${OUTPUT}"
          if [ -z "${OUTPUT}" ]; then
            echo "::error::The TorrServer binary did not start"
            exit 1
          fi

          for bin in "$DEST_DIR"/TorrServer-android-*; do
            if [ ! -s "${bin}" ]; then
              echo "::error::${bin} is empty"
              exit 1
            fi

            file "${bin}"

            if ! file "${bin}" | grep -qi 'ELF'; then
              echo "::error::${bin} is not an ELF binary"
              exit 1
            fi

            if ! file "${bin}" | grep -q 'linker'; then
              echo "::warning::${bin} is not linked against the Android dynamic loader"
            fi
          done

      - name: Clone and patch TorrServe Android client
        env:
          UPDATE_HOST: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/torr
        run: |
          git clone https://github.com/YouROK/TorrServe.git torrserv_android
          cd torrserv_android
          
          REPO_URL="${{ github.repository }}"
          UPDATE_HOST=$(printf '%s' "${UPDATE_HOST}" | tr '[:upper:]' '[:lower:]')

          find app/src -type f \( -name "*.kt" -o -name "*.java" \) -exec sed -i "s|YouROK/TorrServer|$REPO_URL|g" {} +
          
          CONSTS="app/src/main/java/ru/yourok/torrserve/app/Consts.kt"
          sed -i "s|https://releases.yourok.ru/torr|${UPDATE_HOST}|g" "$CONSTS"

          grep -n 'REL_HOST\|UPDATE_SERVER_PATH\|UPDATE_APK_PATH\|AD_LINK' "$CONSTS"

          if grep -q 'releases.yourok.ru' "$CONSTS"; then
            echo "::error::Consts.kt still points at the upstream update host - the client would download the censored server"
            exit 1
          fi

          if ! grep -q "${UPDATE_HOST}" "$CONSTS"; then
            echo "::error::Consts.kt was not patched - the update endpoints format changed upstream"
            exit 1
          fi
          
          echo "Patched Android client to use: $REPO_URL"
          echo "Android client update host: ${UPDATE_HOST}"

      - name: Build, sign and package the Android client
        run: |
          cd torrserv_android
          chmod +x gradlew
          ./gradlew assembleRelease || echo "::warning::Android APK build failed - releasing the SPK only"
          
          mkdir -p ../android_out

          UNSIGNED=$(ls -1 app/build/outputs/apk/release/*.apk 2>/dev/null | head -1 || true)
          if [ -z "${UNSIGNED}" ]; then
            echo "::warning::Gradle produced no APK - the Android client is not published"
            exit 0
          fi

          KEYSTORE="../keystore/torrserve-release.jks"
          if [ ! -f "${KEYSTORE}" ]; then
            echo "::error::${KEYSTORE#../} is missing - the Android client cannot be signed"
            exit 1
          fi

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS=$(dirname "$(ls -1 "${SDK}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)")

          if [ ! -x "${BUILD_TOOLS}/apksigner" ]; then
            echo "::error::apksigner was not found below ${SDK}/build-tools"
            exit 1
          fi

          APK="../android_out/TorrServe-Android-${{ needs.check-version.outputs.version }}.apk"

          cp "${UNSIGNED}" ../android_out/unsigned.apk
          "${BUILD_TOOLS}/zipalign" -p -f 4 ../android_out/unsigned.apk ../android_out/aligned.apk
          "${BUILD_TOOLS}/apksigner" sign \
            --ks "${KEYSTORE}" \
            --ks-key-alias torrserver \
            --ks-pass pass:torrserver \
            --key-pass pass:torrserver \
            --out "${APK}" \
            ../android_out/aligned.apk
          rm -f ../android_out/unsigned.apk ../android_out/aligned.apk

          "${BUILD_TOOLS}/apksigner" verify --print-certs "${APK}"

          CODE=$(grep -E '^[[:space:]]*versionCode[[:space:]]+[0-9]+' app/build.gradle | head -1 | grep -oE '[0-9]+' || true)
          NAME=$(grep -E '^[[:space:]]*versionName[[:space:]]+"' app/build.gradle | head -1 | sed -E 's/.*"([^"]*)".*/\1/' || true)
          printf '{"version": "%s", "versionInt": %s}\n' "${NAME:-unknown}" "${CODE:-0}" > ../android_out/client_version.json
          
          ls -lh ../android_out/

      - name: Install DSM build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip xz-utils

      - name: Build SPK packages
        run: |
          chmod +x build-package.sh src/INFO.sh src/scripts/* src/WIZARD_UIFILES/* 2>/dev/null || true
          make

      - name: Validate SPK metadata
        run: |
          shopt -s nullglob
          spk_files=(spk/*.spk)

          if [ ${#spk_files[@]} -eq 0 ]; then
            echo "::error::No SPK was produced"
            exit 1
          fi

          for spk in "${spk_files[@]}"; do
            version=$(tar -xOf "${spk}" INFO | sed -n 's/^version="\(.*\)"$/\1/p')
            echo "${spk}: version=${version}"

            if ! printf '%s' "${version}" | grep -Eq '^[0-9]+(\.[0-9]+)*(-[0-9]+)?$'; then
              echo "::error::Package Center rejects non numeric versions - ${spk} carries '${version}'"
              exit 1
            fi

            outer=$(tar -tvf "${spk}" | awk '{print $1" "$NF}')
            for member in scripts/setup-permissions scripts/start-stop-status WIZARD_UIFILES/uninstall_uifile; do
              case "${outer}" in
                *"-rwxr-xr-x ${member}"*) ;;
                *)
                  echo "::error::${spk}: ${member} is not executable inside the SPK"
                  exit 1
                  ;;
              esac
            done

            inner=$(tar -xOf "${spk}" package.tgz | tar -tJv | awk '{print $1" "$NF}')
            for member in bin/TorrServer bin/ffprobe helper/helper.py; do
              case "${inner}" in
                *"-rwxr-xr-x ${member}"*) ;;
                *)
                  echo "::error::${spk}: ${member} is not executable inside package.tgz"
                  exit 1
                  ;;
              esac
            done
          done

      - name: List build results
        run: |
          echo "Built SPK packages:"
          find spk -maxdepth 1 -type f -name '*.spk' -print
          echo "Built binary tree:"
          ls -lh dest_bin/ || true
          echo "Built Android APK:"
          ls -lh android_out/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: TorrServer-Build-${{ needs.check-version.outputs.version }}
          path: |
            spk/*.spk
            dest_bin/TorrServer-*
            android_out/*.apk
            android_out/client_version.json
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs:
      - check-version
      - build
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: TorrServer-Build-${{ needs.check-version.outputs.version }}
          path: artifacts

      - name: Show release files
        run: |
          echo "Release version: ${{ needs.check-version.outputs.version }}"
          echo "Files:"
          ls -lh artifacts/

      - name: Generate the TorrServer manifests served to the Android client
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          TS_VERSION=$(grep -E '^TORRSERVER_VERSION[[:space:]]*:=' Makefile | sed 's/^TORRSERVER_VERSION[[:space:]]*:=//' | xargs)
          export TS_VERSION
          python3 - <<'PY'
          import json
          import os
          import pathlib

          repo = os.environ["GITHUB_REPOSITORY"]
          version = os.environ["VERSION"]
          ts_version = os.environ["TS_VERSION"]
          base = f"https://github.com/{repo}"
          tag = f"v{version}"

          def asset(name):
              return f"{base}/releases/download/{tag}/{name}"

          links = {
              f"android-{arch}": asset(f"TorrServer-android-{arch}")
              for arch in ("arm64", "arm7", "amd64", "386")
          }
          links["linux-amd64"] = asset("TorrServer-linux-amd64")

          manifests = pathlib.Path("torr")
          manifests.mkdir(parents=True, exist_ok=True)

          server_manifest = manifests / "server_release.json"
          server_manifest.write_text(
              json.dumps({"version": ts_version, "links": links}, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"torr/server_release.json <- version {ts_version}, {len(links)} links")

          client_info = pathlib.Path("artifacts/android_out/client_version.json")
          entries = []
          if client_info.exists():
              info = json.loads(client_info.read_text(encoding="utf-8"))
              entries.append({
                  "version": info.get("version", "unknown"),
                  "versionInt": int(info.get("versionInt", 0)),
                  "desc": f"TorrServe {info.get('version', 'unknown')} - uncensored client build",
                  "link": asset(f"TorrServe-Android-{version}.apk"),
              })
          apk_manifest = manifests / "apk_release.json"
          apk_manifest.write_text(json.dumps(entries, indent=2) + "\n", encoding="utf-8")
          print(f"torr/apk_release.json <- {len(entries)} entr(ies)")
          PY

      - name: Generate packages.json for the DSM package source
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import shutil
          import subprocess

          version = os.environ["VERSION"]
          repo = os.environ["GITHUB_REPOSITORY"]
          base = f"https://github.com/{repo}"
          tag = f"v{version}"

          def spk_platforms(arch):
              info = subprocess.run(
                  ["bash", "src/INFO.sh", version, arch, "1"],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout
              match = re.search(r'^arch="(.*)"$', info, re.MULTILINE)
              if not match:
                  raise SystemExit(f"::error::No arch= line in src/INFO.sh for {arch}")
              return match.group(1)

          platforms_by_arch = {arch: spk_platforms(arch) for arch in ("amd64",)}

          thumbnails = [
              f"https://raw.githubusercontent.com/{repo}/main/src/ui/images/torrserver-72.png",
              f"https://raw.githubusercontent.com/{repo}/main/src/ui/images/torrserver-256.png",
          ]

          packages = []
          entries = {}
          for arch, platforms in platforms_by_arch.items():
              spks = sorted(pathlib.Path("artifacts/spk").glob(f"*-{arch}.spk"))
              if not spks:
                  raise SystemExit(f"::error::No SPK for {arch} found in artifacts/spk")

              spk = spks[0]
              blob = spk.read_bytes()
              entry = {
                  "package": "TorrServer",
                  "version": version,
                  "dname": "TorrServer DSM",
                  "desc": "TorrServer, torrent to http (Uncensored build)",
                  "link": f"{base}/releases/download/{tag}/{spk.name}",
                  "size": len(blob),
                  "md5": hashlib.md5(blob).hexdigest(),
                  "arch": platforms,
                  "qinst": True,
                  "qstart": True,
                  "qupgrade": True,
                  "beta": False,
                  "startable": "yes",
                  "thirdparty": True,
                  "silent_install": True,
                  "silent_uninstall": True,
                  "silent_upgrade": True,
                  "maintainer": "TorrServer",
                  "maintainer_url": "https://github.com/YouROK/TorrServer",
                  "distributor": "Alex-Goodwin1",
                  "distributor_url": base,
                  "support_url": base,
                  "category": 0,
                  "subcategory": 0,
                  "type": 0,
                  "changelog": "",
                  "thumbnail": thumbnails,
                  "thumbnail_retina": thumbnails,
                  "snapshot": [],
              }
              packages.append(entry)
              entries[arch] = entry
              print(f"packages.json <- {spk.name} ({len(blob)} bytes, md5 {hashlib.md5(blob).hexdigest()})")

          pathlib.Path("packages.json").write_text(
              json.dumps({"packages": packages}, indent=2) + "\n", encoding="utf-8"
          )

          for arch, entry in entries.items():
              catalog = pathlib.Path("catalog") / arch / "packages.json"
              catalog.parent.mkdir(parents=True, exist_ok=True)
              catalog.write_text(
                  json.dumps({"packages": [entry]}, indent=2) + "\n", encoding="utf-8"
              )
              print(f"catalog/{arch}/packages.json <- {entry['link'].rsplit('/', 1)[-1]}")

          for stale in pathlib.Path("catalog").glob("*"):
              if stale.is_dir() and stale.name not in entries:
                  shutil.rmtree(stale)
                  print(f"catalog/{stale.name} <- removed (architecture no longer built)")
          PY
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add packages.json catalog torr

          if git diff --cached --quiet; then
            echo "packages.json, catalog/ and torr/ already describe the built artifacts"
          else
            git commit -m "Update package source and android manifests to ${VERSION} [skip ci]"
            git push
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          RELEASE_FILES="$(ls -1 artifacts/spk/*.spk artifacts/dest_bin/TorrServer-* artifacts/android_out/*.apk 2>/dev/null || true)"

          if [ -z "${RELEASE_FILES}" ]; then
            echo "::error::No release files were produced"
            exit 1
          fi

          echo "Release files:"
          printf '%s\n' ${RELEASE_FILES}

          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists - uploading the new files"
            gh release upload "v${VERSION}" ${RELEASE_FILES} --clobber
          else
            gh release create "v${VERSION}" ${RELEASE_FILES} \
              --title "TorrServer DSM & Android v${VERSION} (Uncensored)" \
              --generate-notes
          fi
