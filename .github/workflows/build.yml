name: Build TorrServer DSM & Android Client

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    name: Check package version
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check PKG_VERSION change
        id: check
        run: |
          NEW_VERSION=$(grep -E '^PKG_VERSION[[:space:]]*:=' Makefile | head -1 | sed 's/^PKG_VERSION[[:space:]]*:=//' | xargs)
          echo "Current version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual workflow run"
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OLD_VERSION=$(git show "${{ github.event.before }}:Makefile" 2>/dev/null | grep -E '^PKG_VERSION[[:space:]]*:=' | head -1 | sed 's/^PKG_VERSION[[:space:]]*:=//' | xargs)
          echo "Previous version: $OLD_VERSION"

          if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
            echo "Package version changed!"
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Package version did not change."
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build SPK and Android APK
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Setup Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Clone and patch original TorrServer
        run: |
          TS_VERSION=$(grep -E '^TORRSERVER_VERSION[[:space:]]*:=' Makefile | sed 's/^TORRSERVER_VERSION[[:space:]]*:=//' | xargs)
          git clone https://github.com/YouROK/TorrServer.git torrserver_src
          cd torrserver_src
          git checkout "$TS_VERSION"
          
          sed -i '/var defaultBlockedReferers = \[\]string{/,/^}/c\var defaultBlockedReferers = []string{}' server/web/waf/referer.go
          
          grep -A 1 "var defaultBlockedReferers" server/web/waf/referer.go

      - name: Build TorrServer binaries
        run: |
          mkdir -p dest_bin
          DEST_DIR=$(pwd)/dest_bin
          
          cd torrserver_src/server
          LDFLAGS="-s -w -checklinkname=0"
          
          echo "Building linux/amd64..."
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="$LDFLAGS" -tags=nosqlite -trimpath -o "$DEST_DIR/TorrServer-linux-amd64" ./cmd
          
          echo "Building linux/arm64..."
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="$LDFLAGS" -tags=nosqlite -trimpath -o "$DEST_DIR/TorrServer-linux-arm64" ./cmd
          
          echo "Building linux/arm7..."
          GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -ldflags="$LDFLAGS" -tags=nosqlite -trimpath -o "$DEST_DIR/TorrServer-linux-arm7" ./cmd
          
          echo "Built binaries:"
          ls -lh "$DEST_DIR"

      - name: Clone and patch TorrServe Android client
        run: |
          git clone https://github.com/YouROK/TorrServe.git torrserv_android
          cd torrserv_android
          
          REPO_URL="${{ github.repository }}"
          
          find app/src -type f \( -name "*.kt" -o -name "*.java" \) -exec sed -i "s|YouROK/TorrServer|$REPO_URL|g" {} +
          
          echo "Patched Android client to use: $REPO_URL"

      - name: Build Android APK
        run: |
          cd torrserv_android
          chmod +x gradlew
          ./gradlew assembleRelease
          
          mkdir -p ../android_out
          cp app/build/outputs/apk/release/app-release-unsigned.apk ../android_out/TorrServe-Android-${{ needs.check-version.outputs.version }}.apk 2>/dev/null || \
          cp app/build/outputs/apk/release/*.apk ../android_out/TorrServe-Android-${{ needs.check-version.outputs.version }}.apk 2>/dev/null || true
          
          ls -lh ../android_out/

      - name: Install DSM build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip xz-utils

      - name: Build SPK packages
        run: |
          make

      - name: List build results
        run: |
          echo "Built SPK packages:"
          find spk -maxdepth 1 -type f -name '*.spk' -print
          echo "Built Android APK:"
          ls -lh android_out/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TorrServer-Build-${{ needs.check-version.outputs.version }}
          path: |
            spk/*.spk
            android_out/*.apk
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs:
      - check-version
      - build
    if: |
      github.event_name == 'push' &&
      needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: TorrServer-Build-${{ needs.check-version.outputs.version }}
          path: artifacts

      - name: Show release files
        run: |
          echo "Release version: ${{ needs.check-version.outputs.version }}"
          echo "Files:"
          ls -lh artifacts/

      - name: Update packages.json
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          cat <<EOF > packages.json
          {
            "packages": [
              {
                "package": "TorrServer",
                "version": "${VERSION}",
                "displayname": "TorrServer DSM",
                "description": "TorrServer DSM + Android Client (Uncensored build)",
                "arch": "x86_64 aarch64 armv7",
                "maintainer": "Alex-Goodwin1",
                "distributor": "Alex-Goodwin1",
                "distributor_url": "https://github.com/${{ github.repository }}",
                "category": "download",
                "beta": false,
                "startable": true,
                "installable": true,
                "uninstallable": true
              }
            ]
          }
          EOF
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages.json
          git commit -m "Update packages.json to ${VERSION} [skip ci]" || echo "No changes to commit"
          git push

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            artifacts/spk/*.spk \
            artifacts/android_out/*.apk \
            --title "TorrServer DSM & Android v${VERSION} (Uncensored)" \
            --generate-notes
