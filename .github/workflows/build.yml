name: Build TorrServer DSM & Android Client

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# The runner image is pinned instead of using ubuntu-latest: the Android SDK,
# Java 21, tar/xz/make and Go toolchain combination used here is the one the
# packages were validated with, and GitHub announced that the ubuntu-latest
# label will migrate to Ubuntu 26.04.

# Serialise builds so two runs can never publish the same version twice.
concurrency:
  group: torrserver-build
  cancel-in-progress: false

jobs:
  check-version:
    name: Check package version
    runs-on: ubuntu-24.04
    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check PKG_VERSION change
        id: check
        run: |
          NEW_VERSION=$(grep -E '^PKG_VERSION[[:space:]]*:=' Makefile | head -1 | sed 's/^PKG_VERSION[[:space:]]*:=//' | xargs)
          echo "Current version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual workflow run"
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OLD_VERSION=$(git show "${{ github.event.before }}:Makefile" 2>/dev/null | grep -E '^PKG_VERSION[[:space:]]*:=' | head -1 | sed 's/^PKG_VERSION[[:space:]]*:=//' | xargs)
          echo "Previous version: $OLD_VERSION"

          if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
            echo "Package version changed!"
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Package version did not change."
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build SPK and Android APK
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache: false

      - name: Setup Java for Android
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Clone and patch original TorrServer
        run: |
          TS_VERSION=$(grep -E '^TORRSERVER_VERSION[[:space:]]*:=' Makefile | sed 's/^TORRSERVER_VERSION[[:space:]]*:=//' | xargs)
          git clone https://github.com/YouROK/TorrServer.git torrserver_src
          cd torrserver_src
          git checkout "$TS_VERSION"
          
          sed -i '/var defaultBlockedReferers = \[\]string{/,/^}/c\var defaultBlockedReferers = []string{}' server/web/waf/referer.go
          
          grep -A 1 "var defaultBlockedReferers" server/web/waf/referer.go

          # sed exits with status 0 even when its pattern does not match, so a
          # renamed or reshaped block upstream would silently ship the censored
          # binary. Fail the build instead of publishing it.
          if ! grep -q 'var defaultBlockedReferers = \[\]string{}' server/web/waf/referer.go; then
            echo "::error::referer.go was not patched - defaultBlockedReferers format changed upstream"
            exit 1
          fi

      - name: Build TorrServer binaries
        env:
          GOTOOLCHAIN: auto
        run: |
          mkdir -p dest_bin
          DEST_DIR=$(pwd)/dest_bin
          
          cd torrserver_src/server
          LDFLAGS="-s -w -checklinkname=0"

          # Newer TorrServer releases require a recent Go toolchain (go.mod of
          # YouROK/TorrServer asks for Go 1.25.x). GOTOOLCHAIN=auto makes the
          # installed Go download it automatically, and if a future linker
          # dropped -checklinkname the build is retried without it.
          build_target() {
            local goos="$1" goarch="$2" goarm="$3" output="$4"

            if [ -n "${goarm}" ]; then
              GOOS="$goos" GOARCH="$goarch" GOARM="$goarm" CGO_ENABLED=0 \
                go build -ldflags="$LDFLAGS" -tags=nosqlite -trimpath -o "$output" ./cmd && return 0
            else
              GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
                go build -ldflags="$LDFLAGS" -tags=nosqlite -trimpath -o "$output" ./cmd && return 0
            fi

            echo "::warning::Retrying ${goos}/${goarch} without -checklinkname"

            if [ -n "${goarm}" ]; then
              GOOS="$goos" GOARCH="$goarch" GOARM="$goarm" CGO_ENABLED=0 \
                go build -ldflags="-s -w" -tags=nosqlite -trimpath -o "$output" ./cmd
            else
              GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
                go build -ldflags="-s -w" -tags=nosqlite -trimpath -o "$output" ./cmd
            fi
          }
          
          echo "Building linux/amd64..."
          build_target linux amd64 "" "$DEST_DIR/TorrServer-linux-amd64"
          
          echo "Building linux/arm64..."
          build_target linux arm64 "" "$DEST_DIR/TorrServer-linux-arm64"
          
          # 32 bit ARM is GOARCH=arm together with GOARM=7: "arm7" is not a
          # GOARCH value and makes the toolchain die with
          # "go: unsupported GOOS/GOARCH pair linux/arm7". The output file keeps
          # the arm7 name because that is the arch name build-package.sh and
          # src/INFO.sh use for the DSM platform list.
          echo "Building linux/arm (GOARM=7)..."
          build_target linux arm 7 "$DEST_DIR/TorrServer-linux-arm7"
          
          echo "Built binaries:"
          ls -lh "$DEST_DIR"

          # Smoke test: a broken (e.g. unpatched linkname) binary must never
          # reach a release, so the amd64 build has to start and answer.
          OUTPUT=$("$DEST_DIR/TorrServer-linux-amd64" --version 2>&1) && STATUS=0 || STATUS=$?
          echo "TorrServer --version exited with ${STATUS}: ${OUTPUT}"
          if [ -z "${OUTPUT}" ]; then
            echo "::error::The TorrServer binary did not start"
            exit 1
          fi

      - name: Clone and patch TorrServe Android client
        run: |
          git clone https://github.com/YouROK/TorrServe.git torrserv_android
          cd torrserv_android
          
          REPO_URL="${{ github.repository }}"
          
          find app/src -type f \( -name "*.kt" -o -name "*.java" \) -exec sed -i "s|YouROK/TorrServer|$REPO_URL|g" {} +
          
          echo "Patched Android client to use: $REPO_URL"

      - name: Build Android APK
        run: |
          cd torrserv_android
          chmod +x gradlew
          ./gradlew assembleRelease || echo "::warning::Android APK build failed - releasing the SPK only"
          
          mkdir -p ../android_out
          cp app/build/outputs/apk/release/app-release-unsigned.apk ../android_out/TorrServe-Android-${{ needs.check-version.outputs.version }}.apk 2>/dev/null || \
          cp app/build/outputs/apk/release/*.apk ../android_out/TorrServe-Android-${{ needs.check-version.outputs.version }}.apk 2>/dev/null || true
          
          ls -lh ../android_out/

      - name: Install DSM build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip xz-utils

      - name: Build SPK packages
        run: |
          # GitHub's web uploader stores new files as 100644 while
          # build-package.sh runs src/INFO.sh directly and ships src/scripts
          # as-is, so the executable bits are restored here rather than relying
          # on the git mode surviving an upload through the browser.
          chmod +x build-package.sh src/INFO.sh src/scripts/* src/WIZARD_UIFILES/* 2>/dev/null || true
          make

      - name: Validate SPK metadata
        run: |
          shopt -s nullglob
          spk_files=(spk/*.spk)

          if [ ${#spk_files[@]} -eq 0 ]; then
            echo "::error::No SPK was produced"
            exit 1
          fi

          for spk in "${spk_files[@]}"; do
            version=$(tar -xOf "${spk}" INFO | sed -n 's/^version="\(.*\)"$/\1/p')
            echo "${spk}: version=${version}"

            if ! printf '%s' "${version}" | grep -Eq '^[0-9]+(\.[0-9]+)*(-[0-9]+)?$'; then
              echo "::error::Package Center rejects non numeric versions - ${spk} carries '${version}'"
              exit 1
            fi

            # A script without the executable bit cannot be run by DSM, and the
            # web uploader quietly stores new files as 644, so check the modes
            # that actually ended up inside the package instead of trusting git.
            outer=$(tar -tvf "${spk}" | awk '{print $1" "$NF}')
            for member in scripts/setup-permissions scripts/start-stop-status WIZARD_UIFILES/uninstall_uifile; do
              case "${outer}" in
                *"-rwxr-xr-x ${member}"*) ;;
                *)
                  echo "::error::${spk}: ${member} is not executable inside the SPK"
                  exit 1
                  ;;
              esac
            done

            inner=$(tar -xOf "${spk}" package.tgz | tar -tJv | awk '{print $1" "$NF}')
            for member in bin/TorrServer bin/ffprobe helper/helper.py; do
              case "${inner}" in
                *"-rwxr-xr-x ${member}"*) ;;
                *)
                  echo "::error::${spk}: ${member} is not executable inside package.tgz"
                  exit 1
                  ;;
              esac
            done
          done

      - name: List build results
        run: |
          echo "Built SPK packages:"
          find spk -maxdepth 1 -type f -name '*.spk' -print
          echo "Built Android APK:"
          ls -lh android_out/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: TorrServer-Build-${{ needs.check-version.outputs.version }}
          path: |
            spk/*.spk
            android_out/*.apk
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs:
      - check-version
      - build
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: TorrServer-Build-${{ needs.check-version.outputs.version }}
          path: artifacts

      - name: Show release files
        run: |
          echo "Release version: ${{ needs.check-version.outputs.version }}"
          echo "Files:"
          ls -lh artifacts/

      - name: Generate packages.json for the DSM package source
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          # A DSM package source is not a free-form list: every entry has to
          # point at a real .spk ("link") and carry that file's exact "size" and
          # "md5", otherwise Package Center can neither download nor verify the
          # package. The key names below follow Synology's own repository format
          # (as documented by the reverse engineered "sspks" implementation).
          # The file is written while the freshly built SPKs are still local, so
          # it can never advertise a download that does not exist.
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          version = os.environ["VERSION"]
          repo = os.environ["GITHUB_REPOSITORY"]
          base = f"https://github.com/{repo}"
          tag = f"v{version}"

          # build-package.sh writes TorrServer-DSM-<torrserver version>-<arch>.spk
          # for every arch of the Makefile; the platform names Package Center
          # knows are a different spelling of those same three builds.
          platform_by_arch = {"amd64": "x86_64", "arm64": "aarch64", "arm7": "armv7"}

          packages = []
          entries = {}
          for arch, platform in platform_by_arch.items():
              spks = sorted(pathlib.Path("artifacts/spk").glob(f"*-{arch}.spk"))
              if not spks:
                  raise SystemExit(f"::error::No SPK for {arch} found in artifacts/spk")

              spk = spks[0]
              blob = spk.read_bytes()
              entry = {
                  "package": "TorrServer",
                  "version": version,
                  "dname": "TorrServer DSM",
                  "desc": "TorrServer, torrent to http (Uncensored build)",
                  "link": f"{base}/releases/download/{tag}/{spk.name}",
                  "size": len(blob),
                  "md5": hashlib.md5(blob).hexdigest(),
                  "arch": platform,
                  "qinst": True,
                  "qstart": True,
                  "qupgrade": True,
                  "beta": False,
                  "start": True,
                  "thirdparty": True,
                  "silent_install": True,
                  "silent_uninstall": True,
                  "silent_upgrade": True,
                  "maintainer": "TorrServer",
                  "maintainer_url": "https://github.com/YouROK/TorrServer",
                  "distributor": "Alex-Goodwin1",
                  "distributor_url": base,
                  "support_url": base,
                  "category": 0,
                  "subcategory": 0,
                  "type": 0,
                  "changelog": "",
                  "thumbnail": [
                          f"https://raw.githubusercontent.com/{repo}/main/src/ui/images/torrserver-72.png",
                          f"https://raw.githubusercontent.com/{repo}/main/src/ui/images/torrserver-256.png",
                  ],
                  "snapshot": [],
              }
              packages.append(entry)
              entries[arch] = entry
              print(f"packages.json <- {spk.name} ({len(blob)} bytes, md5 {hashlib.md5(blob).hexdigest()})")

          pathlib.Path("packages.json").write_text(
              json.dumps({"packages": packages}, indent=2) + "\n", encoding="utf-8"
          )

          # Package Center filters packages by architecture only when the
          # repository server does it (Synology's own catalog is queried with
          # arch/unique/build parameters). A file on GitHub Pages is served as
          # is, so the same release is published per architecture as well: one
          # entry each, which removes any ambiguity about which .spk belongs to
          # the NAS and lets Package Center show exactly one TorrServer.
          for arch, entry in entries.items():
              catalog = pathlib.Path("catalog") / arch / "packages.json"
              catalog.parent.mkdir(parents=True, exist_ok=True)
              catalog.write_text(
                  json.dumps({"packages": [entry]}, indent=2) + "\n", encoding="utf-8"
              )
              print(f"catalog/{arch}/packages.json <- {entry['link'].rsplit('/', 1)[-1]}")
          PY
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # packages.json is already tracked while catalog/ may contain brand new
          # files, so stage both and compare the index instead of the work tree.
          git add packages.json catalog

          if git diff --cached --quiet; then
            echo "packages.json and catalog/ already describe the built SPKs"
          else
            git commit -m "Update package source to ${VERSION} [skip ci]"
            git push
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          RELEASE_FILES="$(ls -1 artifacts/spk/*.spk artifacts/android_out/*.apk 2>/dev/null || true)"

          if [ -z "${RELEASE_FILES}" ]; then
            echo "::error::No release files were produced"
            exit 1
          fi

          echo "Release files:"
          printf '%s\n' ${RELEASE_FILES}

          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists - uploading the new files"
            gh release upload "v${VERSION}" ${RELEASE_FILES} --clobber
          else
            gh release create "v${VERSION}" ${RELEASE_FILES} \
              --title "TorrServer DSM & Android v${VERSION} (Uncensored)" \
              --generate-notes
          fi
