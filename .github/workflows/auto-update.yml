name: Auto-update from YouROK/TorrServer

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Get latest release from YouROK/TorrServer
        id: get_release
        run: |
          RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/YouROK/TorrServer/releases/latest")
          
          LATEST_TAG=$(echo "$RESPONSE" | jq -r '.tag_name')
          
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "Failed to fetch latest release tag"
            exit 1
          fi
          
          echo "Latest release tag: $LATEST_TAG"
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Get current version from Makefile
        id: get_current
        run: |
          CURRENT_VERSION=$(grep -E '^TORRSERVER_VERSION[[:space:]]*:=' Makefile | sed 's/^TORRSERVER_VERSION[[:space:]]*:=//')
          CURRENT_VERSION=$(echo "$CURRENT_VERSION" | xargs)
          
          echo "Current version in Makefile: $CURRENT_VERSION"
          echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Compare versions
        id: compare
        run: |
          LATEST="${{ steps.get_release.outputs.tag }}"
          CURRENT="${{ steps.get_current.outputs.current }}"
          
          echo "Comparing: $CURRENT vs $LATEST"
          
          if [ "$CURRENT" != "$LATEST" ]; then
            echo "New version detected!"
            echo "update_needed=true" >> $GITHUB_OUTPUT
          else
            echo "Already up to date"
            echo "update_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Update Makefile
        if: steps.compare.outputs.update_needed == 'true'
        run: |
          LATEST="${{ steps.get_release.outputs.tag }}"
          
          sed -i "s/^TORRSERVER_VERSION[[:space:]]*:=.*/TORRSERVER_VERSION := $LATEST/" Makefile
          
          # TS tag -> numeric base for the SPK version (MatriX.145.1 -> 145.1)
          BASE_VERSION=$(echo "$LATEST" | sed 's/MatriX\.//')

          # Synology only accepts "major.minor.build-revision" with digits, so
          # keep the old revision and bump it for every generated build.
          CURRENT_REV=$(grep -E '^PKG_VERSION[[:space:]]*:=' Makefile | head -1 | sed 's/.*-//' | xargs)
          if ! [[ "$CURRENT_REV" =~ ^[0-9]+$ ]]; then CURRENT_REV=0; fi
          NEW_PKG_VERSION="2.${BASE_VERSION}-$((CURRENT_REV + 1))"
          sed -i "s/^PKG_VERSION[[:space:]]*:=.*/PKG_VERSION := $NEW_PKG_VERSION/" Makefile
          
          echo "Updated Makefile:"
          echo "  TORRSERVER_VERSION := $LATEST"
          echo "  PKG_VERSION := $NEW_PKG_VERSION"

      - name: Commit and push changes
        if: steps.compare.outputs.update_needed == 'true'
        env:
          # gh requires the token in the environment; without GH_TOKEN the
          # `gh workflow run` below fails and the build would never start.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST="${{ steps.get_release.outputs.tag }}"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add Makefile
          git commit -m "Auto-update to $LATEST [skip ci]" || exit 0
          git push

          # A push made with the default GITHUB_TOKEN never triggers other
          # workflows, so the build has to be started explicitly.
          gh workflow run build.yml --ref main
          
          echo "Changes committed and pushed"
          echo "Build workflow dispatched"
