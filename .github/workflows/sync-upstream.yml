name: Sync with Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/vladlenas/TorrServer-DSM.git || true
          git fetch upstream

      - name: Update non-conflicting files from upstream
        run: |
          FILES_TO_UPDATE=(
            "src/helper/helper.py"
            "src/helper/locales/en.json"
            "src/helper/locales/lt.json"
            "src/helper/locales/pl.json"
            "src/helper/locales/ru.json"
            "src/helper/locales/uk.json"
            "src/scripts/certificate-helper"
            "src/scripts/functions"
            "src/scripts/installer"
            "src/scripts/restart-package"
            "src/scripts/service-setup"
            "src/ui"
            "src/nginx"
            "src/conf"
            "src/WIZARD_UIFILES"
            "src/PACKAGE_ICON.PNG"
            "src/PACKAGE_ICON_256.PNG"
            "src/systemd"
          )
          
          for file in "${FILES_TO_UPDATE[@]}"; do
            if git ls-tree -r upstream/main --name-only | grep -q "^$file"; then
              git checkout upstream/main -- "$file" || true
            fi
          done
          
          git add -A
          git diff --staged --quiet || git commit -m "Sync helper scripts and UI from upstream"

      - name: Push changes
        run: |
          git push origin main || echo "No changes to push"
