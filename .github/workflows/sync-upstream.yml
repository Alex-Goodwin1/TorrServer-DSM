name: Sync with Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/vladlenas/TorrServer-DSM.git || true
          git fetch upstream

      - name: Sync upstream files, bump revision and trigger the build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          FORK_OWNED=(
            ".github"
            ".gitignore"
            "LICENSE"
            "Makefile"
            "README.md"
            "packages.json"
            "src/INFO.sh"
            "src/scripts/restart-package"
            "src/scripts/service-setup"
          )

          is_fork_owned() {
            local path="$1" owned
            for owned in "${FORK_OWNED[@]}"; do
              if [ "${path}" = "${owned}" ] || [[ "${path}" == "${owned}/"* ]]; then
                return 0
              fi
            done
            return 1
          }

          while IFS= read -r path; do
            [ -n "${path}" ] || continue
            if is_fork_owned "${path}"; then
              echo "keep fork version: ${path}"
              continue
            fi
            git checkout upstream/main -- "${path}"
          done < <(git ls-tree -r upstream/main --name-only)

          git add -A

          if git diff --cached --quiet; then
            echo "Upstream did not change any packaged file - nothing to do."
            exit 0
          fi

          TS_VERSION=$(sed -n 's/^TORRSERVER_VERSION[[:space:]]*:=[[:space:]]*//p' Makefile | head -1 | xargs)
          BASE_VERSION=$(printf '%s' "${TS_VERSION}" | sed 's/MatriX\.//')

          if [[ ! "${BASE_VERSION}" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::warning::Cannot derive a numeric version from '${TS_VERSION}', using 0.1"
            BASE_VERSION="0.1"
          fi

          CURRENT_REV=$(sed -n 's/^PKG_VERSION[[:space:]]*:=[[:space:]]*//p' Makefile | head -1 | sed 's/.*-//' | xargs)
          if [[ ! "${CURRENT_REV}" =~ ^[0-9]+$ ]]; then
            CURRENT_REV=0
          fi

          NEW_PKG_VERSION="2.${BASE_VERSION}-$((CURRENT_REV + 1))"
          sed -i "s/^PKG_VERSION[[:space:]]*:=.*/PKG_VERSION := ${NEW_PKG_VERSION}/" Makefile

          git add Makefile
          git commit -m "Sync upstream package files, package version ${NEW_PKG_VERSION} [skip ci]"
          git push

          echo "Synced upstream files, new package version: ${NEW_PKG_VERSION}"

          gh workflow run build.yml --ref main -R "${GITHUB_REPOSITORY}"
          echo "Build workflow dispatched"
